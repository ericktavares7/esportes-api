<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esportes Analytics</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Esportes Analytics" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Esportes Analytics</h1>
    <div class="topbar-controles">
      <span id="uso-api-badge" class="uso-api-badge" title="Requisições feitas à API hoje"></span>
      <select id="quantidade-select" title="Quantidade de jogos analisados na forma recente">
        <option value="5">Últimos 5 jogos</option>
        <option value="10" selected>Últimos 10 jogos</option>
        <option value="15">Últimos 15 jogos</option>
      </select>
      <select id="campeonato-select">
        <option value="">Carregando campeonatos...</option>
      </select>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="jogos">Jogos</button>
    <button class="tab-btn" data-tab="tabela">Tabela</button>
    <button class="tab-btn" data-tab="ao-vivo">Ao Vivo</button>
    <button class="tab-btn" data-tab="artilharia">Artilharia</button>
    <button class="tab-btn" data-tab="provaveis">Prováveis</button>
  </nav>

  <main>
    <section id="jogos" class="tab-panel active">
      <div class="rodada-nav">
        <button id="rodada-anterior" class="rodada-nav-btn">‹ Anterior</button>
        <span id="rodada-titulo" class="rodada-titulo"></span>
        <button id="rodada-proxima" class="rodada-nav-btn">Próxima ›</button>
      </div>
      <div id="jogos-lista"></div>
    </section>

    <section id="provaveis" class="tab-panel">
      <div class="provaveis-controles">
        <label for="limiar-select">Mostrar jogos com</label>
        <select id="limiar-select">
          <option value="55">55%</option>
          <option value="60" selected>60%</option>
          <option value="65">65%</option>
          <option value="70">70%</option>
        </select>
        <span>ou mais de chance num dos lados</span>
      </div>
      <p class="provaveis-aviso">
        Calcula a estimativa (mesmo modelo de Poisson do comparativo) pra todos os jogos agendados da
        rodada atual — gasta bem mais requisições que abrir um jogo por vez, por isso é sob demanda.
      </p>
      <button id="btn-calcular-provaveis" class="rodada-nav-btn">Calcular jogos prováveis desta rodada</button>
      <div id="provaveis-lista"></div>
    </section>

    <section id="tabela" class="tab-panel">
      <div class="tabela-wrap">
        <table class="tabela">
          <thead>
            <tr>
              <th>#</th>
              <th>Time</th>
              <th>P</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>SG</th>
            </tr>
          </thead>
          <tbody id="tabela-body"></tbody>
        </table>
      </div>
    </section>

    <section id="ao-vivo" class="tab-panel">
      <div id="ao-vivo-lista" class="cards-grid"></div>
    </section>

    <section id="artilharia" class="tab-panel">
      <ol id="artilharia-lista" class="artilharia-lista"></ol>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <button id="modal-close" class="modal-close">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
